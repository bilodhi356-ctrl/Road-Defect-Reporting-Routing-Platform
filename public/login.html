<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Sign In - KeRRA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="track-view">
    <section class="report-card">
      <p class="eyebrow">KERRA STAFF PORTAL</p>
      <h1>Secure staff sign in</h1>
      <p>Only authorised KeRRA staff can access and update reports.</p>
      <form id="loginForm">
        <div class="field">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" required autocomplete="current-password">
        </div>
        <button class="submit-button" type="submit">Sign in securely <span>→</span></button>
        <p id="loginError" role="alert"></p>
      </form>
      <a class="nav-link" href="/">← Return to citizen reporting</a>
    </section>
  </main>
  <script src="/login.js"></script>
</body>
</html>
