<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track a submitted report</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">R</span>
      <span>Road Defect Reporting &amp; Routing Platform</span>
    </a>
    <nav>
      <a class="nav-link" href="/" data-i18n="nav.report">Report a defect</a>
      <a class="nav-link active" href="/track" data-i18n="nav.track">Track report</a>
      <a class="staff-link" href="/login" data-i18n="nav.staff">Staff portal →</a>
      <label class="language-select" aria-label="Language">
        <span data-i18n="language.label">Language</span>
        <select id="languageSelect" aria-label="Select language">
          <option value="en">English</option>
          <option value="sw">Kiswahili</option>
        </select>
      </label>
    </nav>
  </header>
  <main>
    <section class="view active track-view">
      <p class="eyebrow" data-i18n="track.eyebrow">REPORT FOLLOW-UP</p>
      <h1 data-i18n="track.title">Track a submitted report</h1>
      <p data-i18n="track.lead">Enter your report reference to see its current status.</p>
      <form id="trackForm" class="track-box">
        <input id="trackingId" placeholder="e.g. KRR-2026-1042" data-i18n-placeholder="track.placeholder" autocomplete="off" required>
        <button data-i18n="track.check">Check status</button>
      </form>
      <div id="trackResult" class="track-result"></div>
    </section>
  </main>
  <script src="/i18n.js"></script>
  <script src="/track.js"></script>
</body>
</html>
